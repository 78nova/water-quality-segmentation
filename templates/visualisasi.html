<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <title>Visualisasi</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#f4f7fc">

<div class="container mt-4">

    <h1>📈 Visualisasi Hasil Clustering</h1>

    <a href="/" class="back-btn">
        <i class="bi bi-arrow-left"></i>
    </a>

    <div class="row mt-4">

        <div class="col-md-6 mb-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5>Distribusi Cluster</h5>

                    <img
                    src="{{ url_for('static', filename='img/distribusi_cluster.png') }}"
                    class="img-fluid">
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5>Karakteristik Cluster</h5>

                    <img
                    src="{{ url_for('static', filename='img/karakteristik_cluster.png') }}"
                    class="img-fluid">
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5>Visualisasi PCA</h5>

                    <img
                    src="{{ url_for('static', filename='img/scatter_pca.png') }}"
                    class="img-fluid">
                </div>
            </div>
        </div>

        <div class="col-md-6 mb-4">
            <div class="card shadow">
                <div class="card-body">
                    <h5>Evaluasi DBI</h5>

                    <img
                    src="{{ url_for('static', filename='img/grafik_dbi.png') }}"
                    class="img-fluid">
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
