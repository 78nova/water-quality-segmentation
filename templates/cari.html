<!DOCTYPE html>
<html>

<head>

<title>Cari Lokasi</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body style="background:#f4f7fc">

<div class="container mt-5">

<h1>🔍 Cari Lokasi Pemantauan</h1>

<form action="/cari">

<div class="input-group mt-4">

<input
type="text"
name="lokasi"
class="form-control"
placeholder="Masukkan nama lokasi">

<button
class="btn btn-primary">

Cari

</button>

</div>

</form>

{% if hasil %}

<div class="card mt-5 shadow">

<div class="card-body">

<h3>
📍 {{ hasil["Lokasi"] }}
</h3>

<hr>

<h5>
🏷 Cluster {{ hasil["Cluster"] }}
</h5>

<h5>
💧 {{ hasil["status"] }}
</h5>

<p>
{{ hasil["alasan"] }}
</p>

<hr>

<table class="table">

<tr>
<td>pH</td>
<td>{{ hasil["pH"] }}</td>
</tr>

<tr>
<td>TSS</td>
<td>{{ hasil["TSS"] }}</td>
</tr>

<tr>
<td>TDS</td>
<td>{{ hasil["TDS"] }}</td>
</tr>

<tr>
<td>Klorida</td>
<td>{{ hasil["Klorida"] }}</td>
</tr>

<tr>
<td>Sulfat</td>
<td>{{ hasil["Sulfat"] }}</td>
</tr>

</table>

</div>

</div>

{% endif %}

</div>

</body>

</html>
